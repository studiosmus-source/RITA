name: Build Stella APK

on:
  push:
    branches: [claude/stella-app-design-DtEJQ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk stella.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stella-apk
          path: stella.apk
          retention-days: 90

      - name: Crea o aggiorna Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "✨ Stella - Ultima versione"
          body: |
            ## ✨ Stella APK

            Scarica `stella.apk` e installalo direttamente sul tuo Android!

            > **Prima di installare:**
            > Impostazioni → Sicurezza → **Installa app sconosciute** → attiva per Chrome/Browser
          files: stella.apk
          make_latest: true
